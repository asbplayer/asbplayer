name: Release FFmpeg

on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Choose patch, minor, or current (draft only) to rebuild the existing FFmpeg draft'
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor
                    - current

permissions:
    contents: read

concurrency:
    group: ffmpeg-release
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-24.04
        environment: ffmpeg-release
        permissions:
            contents: write # GitHub requires push access to find drafts for current.
        outputs:
            version: ${{ steps.release-info.outputs.version }}
            release-tag: ${{ steps.release-info.outputs.tag }}
            release-title: ${{ steps.release-info.outputs.title }}
            release-id: ${{ steps.release-info.outputs.releaseId }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - name: Resolve release version
              id: release-info
              env:
                  GH_TOKEN: ${{ github.token }}
                  FFMPEG_VERSION_BUMP: ${{ inputs.bump }}
              run: node ffmpeg/scripts/release-info.mjs --bump "$FFMPEG_VERSION_BUMP" >> "$GITHUB_OUTPUT"

    build:
        needs: version
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
            - run: pnpm install --frozen-lockfile --filter @project/ffmpeg
            - name: Build and verify FFmpeg release
              env:
                  ASB_FFMPEG_RUNTIME_VERSION: ${{ needs.version.outputs.version }}
              run: |
                  pnpm --filter @project/ffmpeg run build:candidate
                  pnpm --filter @project/ffmpeg run verify:release
            - uses: actions/upload-artifact@v7
              with:
                  name: ffmpeg-release-materials
                  path: ffmpeg/release
                  if-no-files-found: error

    publish:
        needs: [version, build]
        runs-on: ubuntu-24.04
        environment: ffmpeg-release
        env:
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: ${{ needs.version.outputs.release-tag }}
            RELEASE_TITLE: ${{ needs.version.outputs.release-title }}
            RELEASE_ID: ${{ needs.version.outputs.release-id }}
            FFMPEG_VERSION_BUMP: ${{ inputs.bump }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
            - uses: actions/download-artifact@v8
              with:
                  name: ffmpeg-release-materials
                  path: ffmpeg/release
            - name: Create or update draft runtime release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node ffmpeg/scripts/publish-release.mjs
