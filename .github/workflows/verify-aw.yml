# Verifies that gh-aw agentic workflow lock files match their source frontmatter.
#
# The `.github/workflows/*.lock.yml` files are generated by `gh aw compile` from
# the frontmatter of the corresponding `.md` files. Editing a frontmatter field
# without recompiling leaves the committed lock file stale (or missing, for a new
# workflow). The generated lock file performs its own frontmatter consistency
# check at runtime, so a stale lock file causes the workflow to fail on every run.
#
# The gh-aw CLI version is pinned to the compiler version recorded in the lock
# files so that compiler hashing changes cannot produce false positives.

name: Verify agentic workflows

on:
    pull_request:
        branches: [main]
        paths:
            - '.github/workflows/**'
            - '.github/aw/**'

permissions:
    contents: read

jobs:
    lock-files:
        name: Lock files in sync
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup gh-aw
              uses: github/gh-aw/actions/setup-cli@v0.86.2
              with:
                  version: v0.86.2

            - name: Check lock files match frontmatter
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  status="$(gh aw list --json)"
                  if ! jq -e 'all(.[]; .compiled == "Yes")' > /dev/null <<<"$status"; then
                    echo "::error::Stale or missing gh-aw lock file(s). Run 'gh aw compile' and commit the resulting .lock.yml files."
                    jq -r '.[] | select(.compiled != "Yes") | "  - \(.workflow): \(.compiled)"' <<<"$status"
                    exit 1
                  fi
