name: Release Firefox for Android build

on:
    workflow_dispatch:
        inputs:
            releaseTag:
                description: 'Release tag'
                required: true
                type: string
jobs:
    submit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.releaseTag }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - run: pnpm install --filter @project/extension --filter @project/common --filter @project/client
            - run: pnpm --filter @project/extension run zip:firefox-android
            - name: Read extension release metadata
              id: release-info
              run: node --experimental-strip-types scripts/extension-release-info.ts >> "$GITHUB_OUTPUT"
            - name: Submit to stores
              working-directory: ./extension
              run: |
                  export FIREFOX_EXTENSION_ID="$(jq -r '.extension.firefoxAndroid.storeId' ../project.json)"
                  pnpm wxt submit \
                    --firefox-zip ".output/$FIREFOX_ASSET.zip" --firefox-sources-zip ".output/$FIREFOX_SOURCES.zip" \
                    --firefox-channel listed
              env:
                  FIREFOX_ASSET: ${{ steps.release-info.outputs.firefoxAndroid }}
                  FIREFOX_SOURCES: ${{ steps.release-info.outputs.sources }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
