name: Verify app deploy

on:
    pull_request:
        branches: [cf-pages]

permissions:
    contents: read

jobs:
    loc-versions:
        name: Loc versions
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Check loc versions
              env:
                  LOC_VERSIONS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  LOC_VERSIONS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node --experimental-strip-types scripts/bump-loc-versions.ts --check
