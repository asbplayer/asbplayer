name: Verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        branches: [main]

concurrency:
    group: verify-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - name: Check synchronized project files
              run: |
                  set -euo pipefail
                  pnpm sync:project
                  if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                      echo "Run pnpm sync:project and commit the generated files."
                      git status --short --untracked-files=all
                      git diff
                      exit 1
                  fi

            - run: pnpm install --frozen-lockfile --filter @project/extension --filter @project/common --filter @project/client --filter @project/ffmpeg

            - run: pnpm run verify

            - run: pnpm --filter @project/extension exec wxt zip

            - run: pnpm --filter @project/client run buildFast
