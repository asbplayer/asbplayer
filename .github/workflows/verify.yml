name: Verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        branches: [main]

jobs:
    build:
        name: Verify
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - uses: astral-sh/setup-uv@v9

            - name: Check generated metadata and Anki lockfile
              run: |
                  set -euo pipefail
                  node --experimental-strip-types scripts/sync-project-config.ts --check
                  uv lock --project plugins/anki --check

            - name: Check FFmpeg runtime version transition
              env:
                  VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
                  VERSION_HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
              run: pnpm run check:ffmpeg-version --base "$VERSION_BASE_REF" --head "$VERSION_HEAD_REF"

            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @project/extension run zip
            - run: pnpm --filter @project/client run build
            - run: pnpm --filter @project/ffmpeg run verify:code
