name: Verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Verify
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm

            - run: pnpm install --filter @project/extension --filter @project/common --filter @project/client
            - run: pnpm --filter @project/extension run zip
            - run: pnpm --filter @project/client run build
